<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prumo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f68'/%3E%3Cline x1='16' y1='5' x2='16' y2='15' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M16 14c3.4 3.4 5 6 5 8.6a5 5 0 0 1-10 0c0-2.6 1.6-5.2 5-8.6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ------------------------------------------------------------------ paleta
   IDEIA: um prumo de pedreiro: precisão calma, nada de ruído.
   COR: papel quente (60), tinta grafite (30), verde-petróleo do prumo (10); terracota como acento.
   ESTADO: verde = completo, âmbar = lacunas, índigo = aprovado, tijolo = erro (distintos também sob daltonismo).
   A paleta é verificada por tools/cores.py (contraste WCAG AA e ΔE2000 ≥ 15 sob protanopia,
   deuteranopia e tritanopia) e pelos testes. Mudou uma cor? Rode python tools/cores.py. */
:root{
  --bg:#f5f3ee;--sup:#ffffff;--sup2:#faf8f4;--sup3:#efece5;--borda:#e6e1d8;--borda-forte:#d3cdc1;
  --texto:#23211d;--suave:#6f6a61;--fraco:#8d877c;
  --pri:#2f6f68;--pri-2:#255a54;--pri-bg:#e3efec;--pri-txt:#ffffff;
  --terra:#a14f2b;--terra-bg:#f8e9e0;
  --ambar:#986c16;--ambar-txt:#835c11;--ambar-bg:#f8eed6;
  --verm:#7e2920;--verm-bg:#f8e4e0;
  --azul:#6c64c4;--azul-txt:#5e56b5;--azul-bg:#ebeafa;
  --roxo:#8e3d74;--roxo-bg:#f6e6f0;
  --console:#1b1e1d;--console-txt:#dfe3dc;
  --sombra:0 1px 2px rgba(35,30,20,.05),0 6px 22px rgba(35,30,20,.06);
  --sombra-alta:0 24px 70px rgba(25,20,10,.22);
  --raio:16px;--raio-p:10px;--t:170ms cubic-bezier(.2,.7,.2,1);
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514;--sup:#1a1e1d;--sup2:#171a19;--sup3:#222726;--borda:#2a302e;--borda-forte:#3a4240;
  --texto:#ebe8e1;--suave:#a3a097;--fraco:#6b6a64;
  --pri:#6fb7a9;--pri-2:#8ccabe;--pri-bg:#1e302c;--pri-txt:#0e1b18;
  --terra:#e08e66;--terra-bg:#35231a;
  --ambar:#eac06c;--ambar-txt:#eac06c;--ambar-bg:#33291a;
  --verm:#da726c;--verm-bg:#382220;
  --azul:#afa8fa;--azul-txt:#afa8fa;--azul-bg:#25243d;
  --roxo:#e39ac8;--roxo-bg:#36202f;
  --console:#0d0f0e;--console-txt:#dfe3dc;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --sombra-alta:0 24px 70px rgba(0,0,0,.55);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121514;--sup:#1a1e1d;--sup2:#171a19;--sup3:#222726;--borda:#2a302e;--borda-forte:#3a4240;
  --texto:#ebe8e1;--suave:#a3a097;--fraco:#6b6a64;
  --pri:#6fb7a9;--pri-2:#8ccabe;--pri-bg:#1e302c;--pri-txt:#0e1b18;
  --terra:#e08e66;--terra-bg:#35231a;
  --ambar:#eac06c;--ambar-txt:#eac06c;--ambar-bg:#33291a;
  --verm:#da726c;--verm-bg:#382220;
  --azul:#afa8fa;--azul-txt:#afa8fa;--azul-bg:#25243d;
  --roxo:#e39ac8;--roxo-bg:#36202f;
  --console:#0d0f0e;--console-txt:#dfe3dc;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  --sombra-alta:0 24px 70px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Inter,sans-serif;background:var(--bg);color:var(--texto);
  display:grid;grid-template-columns:260px minmax(0,1fr);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--pri-bg)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--borda-forte);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ------------------------------------------------------------------ barra lateral */
aside{background:var(--sup2);border-right:1px solid var(--borda);display:flex;flex-direction:column;padding:18px 14px;gap:14px;min-height:0;height:100vh}
.marca{display:flex;align-items:center;gap:10px;padding:2px 6px 4px;font-weight:650;font-size:17px;letter-spacing:.1px}
.logo{width:28px;height:28px;border-radius:8px;background:var(--pri);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
.marca small{font-weight:450;color:var(--fraco);font-size:11.5px;margin-left:auto}
.rotulo{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--fraco);padding:0 8px;margin:4px 0 6px;font-weight:600}
.busca{position:relative}
.busca svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fraco)}
.busca input{padding-left:32px!important}
.lista-proj{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0;flex:1}
.proj{position:relative;display:flex;align-items:center;gap:10px;cursor:pointer;padding:8px 10px;border-radius:var(--raio-p);transition:background var(--t);border:0;background:none;text-align:left;width:100%}
.proj:hover{background:var(--sup3)}
.proj.ativo{background:var(--pri-bg)}
.proj .av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none;color:#fff}
.proj .tx{min-width:0;flex:1}
.proj b{display:block;font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj span{display:block;font-size:12px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .x{opacity:0;border:0;background:none;color:var(--fraco);cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center}
.proj:hover .x,.proj:focus-within .x{opacity:1}.proj .x:hover{color:var(--verm);background:var(--verm-bg)}
.rodape-lat{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--borda);padding-top:10px}
.atalho{margin-left:auto;font-size:11px;color:var(--fraco);border:1px solid var(--borda);border-radius:5px;padding:0 5px;font-family:var(--mono)}

/* ------------------------------------------------------------------ botões */
.btn{border:1px solid var(--borda);background:var(--sup);padding:7px 13px;border-radius:var(--raio-p);cursor:pointer;line-height:1.35;
  transition:background var(--t),border-color var(--t),transform var(--t),color var(--t);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--borda-forte);background:var(--sup2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-txt)}
.btn.pri:hover{background:var(--pri-2);border-color:var(--pri-2)}
.btn.perigo{color:var(--verm)}.btn.perigo:hover{background:var(--verm-bg);border-color:var(--verm)}
.btn.fan{border-color:transparent;background:transparent;color:var(--suave)}
.btn.fan:hover{background:var(--sup3);color:var(--texto)}
.btn.peq{padding:4px 9px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.larg{width:100%;justify-content:flex-start}
.btn.centro{justify-content:center}

/* ------------------------------------------------------------------ principal */
main{overflow:auto;min-width:0;height:100vh}
.conteudo{max-width:1180px;margin:0 auto;padding:30px 40px 70px}
.cab{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.cab h1{font-size:25px;font-weight:650;margin:0 0 6px;letter-spacing:-.3px}
.cab .meta{color:var(--suave);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cab .acoes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.menu-mob{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:var(--pri-bg);color:var(--pri-2);font-size:12px;font-weight:550;white-space:nowrap}
:root[data-theme="dark"] .chip{color:var(--pri)}
.chip.ambar{background:var(--ambar-bg);color:var(--ambar-txt)}.chip.verm{background:var(--verm-bg);color:var(--verm)}
.chip.azul{background:var(--azul-bg);color:var(--azul-txt)}.chip.cinza{background:var(--sup3);color:var(--suave)}
.chip.terra{background:var(--terra-bg);color:var(--terra)}.chip.roxo{background:var(--roxo-bg);color:var(--roxo)}
.abas{display:flex;border-bottom:1px solid var(--borda);gap:4px;margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.aba{border:0;background:none;cursor:pointer;padding:10px 12px 11px;color:var(--suave);font-weight:550;font-size:13.5px;transition:color var(--t);position:relative;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.aba:hover{color:var(--texto)}
.aba.ativa{color:var(--texto)}
.aba.ativa::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;border-radius:2px;background:var(--pri)}
.aba .cont{font-size:11px;background:var(--ambar-bg);color:var(--ambar-txt);border-radius:99px;padding:0 6px;font-weight:650}
.painel{animation:entra .26s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.cartao{background:var(--sup);border:1px solid var(--borda);border-radius:var(--raio);box-shadow:var(--sombra);padding:20px 22px;min-width:0}
.cartao h3{margin:0 0 12px;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px}
.cartao h3 .dir{margin-left:auto}
.grade{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.num{font-size:28px;font-weight:650;letter-spacing:-.6px;line-height:1.1}
.num small{font-size:13px;color:var(--suave);font-weight:450;margin-left:4px;letter-spacing:0}
.legenda{color:var(--suave);font-size:12.5px}
.barra{height:6px;background:var(--sup3);border-radius:99px;overflow:hidden;margin-top:12px}
.barra i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}

/* jornada (fluxo principal do Prumo) */
.heroi{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px;align-items:center;
  background:linear-gradient(135deg,var(--pri-bg),var(--sup) 70%);border:1px solid var(--borda);border-radius:20px;padding:24px 28px;box-shadow:var(--sombra)}
.anel{position:relative;width:170px;height:170px;margin:auto}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .fundo-anel{stroke:var(--sup3)}.anel .frente{stroke:var(--pri);transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)}
.anel .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.anel .val b{font-size:38px;font-weight:700;letter-spacing:-1px;display:block;line-height:1}
.anel .val span{font-size:12px;color:var(--suave)}
.heroi h2{margin:0 0 4px;font-size:19px;font-weight:650;letter-spacing:-.2px}
.heroi p{margin:0 0 16px;color:var(--suave)}
.etapas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:18px}
.etapa{border:1px solid var(--borda);background:var(--sup);border-radius:12px;padding:10px 12px;cursor:pointer;transition:border-color var(--t),transform var(--t);text-align:left}
.etapa:hover{border-color:var(--borda-forte);transform:translateY(-1px)}
.etapa .n{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--suave);font-weight:600;margin-bottom:3px}
.etapa .n i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:var(--sup3);color:var(--suave)}
.etapa.ok .n i{background:var(--pri);color:var(--pri-txt)}
.etapa.atual{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.etapa b{display:block;font-size:13px;font-weight:600}
.etapa span{font-size:12px;color:var(--suave)}

/* listas */
.linhas{display:flex;flex-direction:column}
.linha{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--borda)}
.linha:last-child{border-bottom:0}
.linha.clic{cursor:pointer;border-radius:9px;transition:background var(--t);padding-left:10px;padding-right:10px;border-bottom:0}
.linha.clic:hover{background:var(--sup2)}
.linha.sel{background:var(--pri-bg)}
.linha .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ponto{width:8px;height:8px;border-radius:50%;background:var(--fraco);flex:none}
.ponto.ok{background:var(--pri)}.ponto.and{background:var(--ambar)}.ponto.apr{background:var(--azul)}.ponto.err{background:var(--verm)}

/* documentos e kit */
.docs{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.lateral-docs{position:sticky;top:0;max-height:calc(100vh - 210px);overflow:auto;padding:10px}
.preview{min-height:480px}
.barra-doc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px;padding-bottom:12px;border-bottom:1px solid var(--borda)}
.barra-doc .cam{flex:1;min-width:160px;font-family:var(--mono);font-size:12px;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;background:var(--sup3);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:4px 10px;border-radius:7px;cursor:pointer;color:var(--suave);font-size:12.5px;font-weight:550}
.seg button.ativo{background:var(--sup);color:var(--texto);box-shadow:var(--sombra)}
.doc-corpo{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.doc-corpo.com-toc{grid-template-columns:minmax(0,1fr) 190px}
.toc{position:sticky;top:10px;align-self:start;font-size:12.5px;border-left:1px solid var(--borda);padding-left:12px;max-height:70vh;overflow:auto}
.toc a{display:block;color:var(--suave);text-decoration:none;padding:3px 0;line-height:1.35;cursor:pointer}
.toc a:hover{color:var(--pri)}.toc a.h3{padding-left:10px;font-size:12px}
.editor{width:100%;min-height:62vh;font:13px/1.6 var(--mono);font-variant-ligatures:none;background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio-p);padding:14px 16px;resize:vertical;outline:none;tab-size:2}
.editor:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
.md{line-height:1.7;font-size:14.2px}
.md h1{font-size:22px;margin:0 0 14px;letter-spacing:-.3px}.md h2{font-size:17px;margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--borda)}
.md h3{font-size:15px;margin:20px 0 6px}.md h4{font-size:13.5px;margin:14px 0 4px;color:var(--suave)}
.md table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--borda);padding:7px 10px;text-align:left;vertical-align:top}
.md th{background:var(--sup2);font-weight:600}
.md code{font-family:var(--mono);font-size:12.5px;background:var(--sup3);padding:1px 5px;border-radius:5px}
.md pre{background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio-p);padding:12px 14px;overflow:auto}
.md pre code{padding:0;background:none}
.md blockquote{margin:10px 0;padding:6px 14px;border-left:3px solid var(--pri);color:var(--suave);background:var(--sup2);border-radius:0 8px 8px 0}
.md .lac{background:var(--ambar-bg);color:var(--ambar-txt);border-radius:5px;padding:0 4px;font-weight:550}
.md .lac.foco{outline:2px solid var(--ambar);outline-offset:2px}
.md a{color:var(--pri)}
.md .id{font-family:var(--mono);font-size:12px;background:var(--azul-bg);color:var(--azul-txt);padding:0 5px;border-radius:5px;font-weight:600}
.mmd{background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio-p);padding:16px;margin:12px 0;overflow:auto;text-align:center}
.mmd svg{max-width:100%;height:auto}
.mmd .erro-mmd{color:var(--verm);font-size:12.5px;text-align:left}
.mmd details{text-align:left;margin-top:8px}
.mmd summary{cursor:pointer;color:var(--suave);font-size:12px}
.kit-grupo{margin-bottom:6px}
.kit-grupo .rotulo{display:flex;align-items:center;gap:6px;margin-top:10px}
.kit-item .nome small{display:block;color:var(--suave);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eventos{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 12px}

/* Claude */
.grupos-tarefa{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.grupo-t{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grupo-t .rotulo{width:92px;margin:0;padding:0}
.pill{cursor:pointer;padding:5px 12px;border-radius:99px;border:1px solid var(--borda);font-size:13px;transition:all var(--t);background:var(--sup)}
.pill:hover{border-color:var(--borda-forte)}
.pill.ativa{background:var(--pri);border-color:var(--pri);color:var(--pri-txt)}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.campo label{font-size:12.5px;color:var(--suave);font-weight:550}
.campo .ajuda{font-size:11.5px;color:var(--fraco)}
input[type=text],input[type=number],input[type=email],input[type=search],select,textarea{background:var(--sup2);border:1px solid var(--borda);border-radius:var(--raio-p);padding:8px 12px;outline:none;transition:border-color var(--t),box-shadow var(--t);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-bg)}
textarea{resize:vertical;min-height:92px}
.console{background:var(--console);color:var(--console-txt);font:12.5px/1.6 var(--mono);border-radius:var(--raio);padding:14px 16px;height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .f{color:#8fcdbf}.console .s{color:#e7bd6c}.console .e{color:#f0a196}
.linha-acao{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.troca{display:inline-flex;align-items:center;gap:8px;color:var(--suave);font-size:13px;cursor:pointer;user-select:none}
.troca input{position:absolute;opacity:0;width:0;height:0}
.troca i{width:32px;height:19px;border-radius:99px;background:var(--borda-forte);position:relative;transition:background var(--t);flex:none}
.troca i::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--t)}
.troca input:checked + i{background:var(--pri)}
.troca input:checked + i::after{transform:translateX(13px)}
.troca input:focus-visible + i{outline:2px solid var(--pri);outline-offset:2px}

/* vazio, modal, toast, paleta */
.vazio{display:grid;place-items:center;min-height:78vh;text-align:center}
.vazio h2{font-weight:650;font-size:24px;margin:18px 0 8px;letter-spacing:-.3px}
.vazio p{color:var(--suave);max-width:500px;margin:0 auto 22px}
.passos-vazio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:680px;margin:28px auto 0;text-align:left}
.passos-vazio div{background:var(--sup);border:1px solid var(--borda);border-radius:14px;padding:14px}
.passos-vazio b{display:block;font-size:13px;margin-bottom:2px}.passos-vazio span{font-size:12.5px;color:var(--suave)}
.fundo{position:fixed;inset:0;background:rgba(20,18,14,.36);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:20;animation:fade .18s ease;padding:16px}
@keyframes fade{from{opacity:0}}
.modal{background:var(--sup);border:1px solid var(--borda);border-radius:18px;box-shadow:var(--sombra-alta);width:min(720px,100%);max-height:90vh;overflow:auto;padding:24px 26px;animation:sobe .24s cubic-bezier(.2,.7,.2,1)}
.modal.peq{width:min(460px,100%)}
@keyframes sobe{from{opacity:0;transform:translateY(10px) scale(.985)}}
.modal h2{margin:0 0 8px;font-size:18px;font-weight:650}
.modal .desc{color:var(--suave);margin:0 0 16px}
.modal .rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.perfis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.perfil{cursor:pointer;border:1px solid var(--borda);border-radius:var(--raio-p);padding:10px 12px;transition:all var(--t);background:var(--sup);text-align:left}
.perfil:hover{border-color:var(--borda-forte)}
.perfil.ativo{border-color:var(--pri);background:var(--pri-bg)}
.perfil b{display:block;font-size:13.5px;font-weight:600}.perfil span{font-size:12px;color:var(--suave)}
.escolhas{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto}
.escolha{display:block;text-align:left;cursor:pointer;border:1px solid var(--borda);border-radius:var(--raio-p);padding:10px 12px;background:var(--sup);transition:border-color var(--t)}
.escolha:hover{border-color:var(--pri)}.escolha b{display:block;font-weight:600;font-size:13.5px}.escolha span{color:var(--suave);font-size:12.5px}
.toasts{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:40}
.toast{background:var(--sup);border:1px solid var(--borda);border-left:3px solid var(--pri);box-shadow:var(--sombra);border-radius:12px;padding:10px 14px;max-width:400px;animation:sobe .22s ease;font-size:13.5px}
.toast.erro{border-left-color:var(--verm)}
.carregando{color:var(--suave);display:flex;gap:8px;align-items:center}
.carregando::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--borda);border-top-color:var(--pri);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.esqueleto{background:linear-gradient(90deg,var(--sup3),var(--sup2),var(--sup3));background-size:200% 100%;animation:brilho 1.2s infinite;border-radius:10px;height:16px;margin:8px 0}
@keyframes brilho{to{background-position:-200% 0}}
.paleta{width:min(600px,100%);padding:0;overflow:hidden;align-self:start;margin-top:12vh}
.paleta input{border:0!important;box-shadow:none!important;border-bottom:1px solid var(--borda)!important;border-radius:0!important;padding:16px 18px!important;font-size:15px;background:var(--sup)!important}
.paleta .res{max-height:52vh;overflow:auto;padding:6px}
.paleta .op{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer}
.paleta .op.sel{background:var(--pri-bg)}
.paleta .op small{margin-left:auto;color:var(--fraco);font-size:11.5px}
.oculto{display:none!important}
.mono{font-family:var(--mono);font-size:12.5px}
.tab-simples{width:100%;border-collapse:collapse;font-size:13px}
.tab-simples td,.tab-simples th{padding:8px 6px;border-bottom:1px solid var(--borda);text-align:left}
.tab-simples th{color:var(--suave);font-weight:550;font-size:12px}
.form-sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}
.form-sec .larga{grid-column:1/-1}
.sujo::after{content:"•";color:var(--terra);margin-left:4px}

/* ------------------------------------------------------------------ responsivo */
@media (max-width:1100px){.etapas{grid-template-columns:repeat(3,minmax(0,1fr))}.doc-corpo.com-toc{grid-template-columns:1fr}.toc{display:none}}
@media (max-width:960px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}.docs{grid-template-columns:1fr}
  .lateral-docs{position:static;max-height:none}.heroi{grid-template-columns:1fr}}
@media (max-width:760px){
  body{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:280px;z-index:25;transform:translateX(-105%);transition:transform var(--t)}
  body.menu-aberto aside{transform:none;box-shadow:var(--sombra-alta)}
  .menu-mob{display:inline-flex}
  .conteudo{padding:18px 16px 60px}
  .etapas,.passos-vazio,.perfis,.form-sec{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .grupo-t .rotulo{width:100%}
}

</aside>
<main id="principal"><div class="conteudo" id="app"></div></main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const guardar = (k, v) => { try { localStorage.setItem("prumo." + k, JSON.stringify(v)); } catch {} };
const lembrar = (k, p) => { try { const v = localStorage.getItem("prumo." + k); return v == null ? p : JSON.parse(v); } catch { return p; } };
const E = {projetos: [], perfis: [], projeto: null, status: null, aba: lembrar("aba", "geral"), docSel: null, modoDoc: "ver",
           tarefa: "especificar", job: null, kit: null, kitSel: null, validacao: null, sujo: false, filtroDoc: ""};
const ICONES = {
  doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>', kit: '<path d="M12 2 3 7l9 5 9-5z"/><path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>',
  claude: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8"/>',
  geral: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  qualidade: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>', gestao: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  pasta: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', codigo: '<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>',
  terminal: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>',
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>', salvar: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/>',
  seta: '<path d="M5 12h14M13 6l6 6-6 6"/>', alvo: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
  atualizar: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', exportar: '<path d="M12 3v12M7 8l5-5 5 5M5 21h14"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONES[n] || ""}</svg>`;
const CORES_AV = ["#2f6f68", "#b85f38", "#3f6496", "#6a55a0", "#9a6b12", "#4e7d4a", "#a0476d"];
const corDe = s => CORES_AV[[...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % CORES_AV.length];
const iniciais = s => String(s || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join("").toUpperCase();

/* ------------------------------------------------------------------ API */
async function api(rota, corpo) {
  const r = await fetch(rota, {method: corpo ? "POST" : "GET", headers: {"X-Prumo-Token": TOKEN, "Content-Type": "application/json"},
                                body: corpo ? JSON.stringify(corpo) : undefined});
  const j = await r.json().catch(() => ({erro: "resposta inválida do servidor"}));
  if (!r.ok) throw new Error(j.erro || r.statusText);
  return j;
}
async function prumo(args, projeto) {
  const r = await api("/api/executar", {args, projeto});
  if (r.dados && r.dados.erro) throw new Error(r.dados.erro);
  if (r.dados === null && r.codigo !== 0) throw new Error((r.stderr || r.saida || "falha no comando").trim().split("\n").pop());
  return r.dados;
}
function toast(msg, erro) {
  const t = document.createElement("div"); t.className = "toast" + (erro ? " erro" : ""); t.textContent = msg;
  $("#toasts").append(t); setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, erro ? 6500 : 3200);
}
const falhou = e => toast(e.message || String(e), true);

/* ------------------------------------------------------------------ diálogos (substituem prompt/confirm) */
function dialogo({titulo, desc = "", corpo = "", botoes = [["Cancelar", null], ["OK", true, "pri"]], peq = true, aoAbrir}) {
  return new Promise(resolve => {
    const f = document.createElement("div"); f.className = "fundo";
    f.innerHTML = `<div class="modal ${peq ? "peq" : ""}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h2>${esc(titulo)}</h2>
      ${desc ? `<p class="desc">${desc}</p>` : ""}<div class="corpo-dlg">${corpo}</div>
      ${botoes.length ? `<div class="rodape">${botoes.map(([n, , cl], i) => `<button class="btn ${cl || ""}" data-i="${i}">${esc(n)}</button>`).join("")}</div>` : ""}</div>`;
    const anterior = document.activeElement;
    const fechar = v => { f.remove(); document.removeEventListener("keydown", tecla, true); if (anterior && anterior.focus) anterior.focus(); resolve(v); };
    const valor = b => typeof b === "function" ? b(f) : b;
    const tecla = e => {
      if (e.key === "Escape") { e.stopPropagation(); fechar(null); }
      if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); const ult = botoes[botoes.length - 1]; if (ult) fechar(valor(ult[1])); }
    };
    document.addEventListener("keydown", tecla, true);
    f.addEventListener("mousedown", e => { if (e.target === f) fechar(null); });
    $$(".rodape .btn", f).forEach(b => b.onclick = () => fechar(valor(botoes[+b.dataset.i][1])));
    f.fechar = fechar;
    document.body.append(f);
    const foco = $("input,textarea,select", f) || $$(".rodape .btn", f).pop(); if (foco) foco.focus();
    if (aoAbrir) aoAbrir(f, fechar);
  });
}
const confirmar = (titulo, desc, rotulo = "Confirmar", perigo) => dialogo({titulo, desc: esc(desc), botoes: [["Cancelar", null], [rotulo, true, perigo ? "pri perigo" : "pri"]]});
const pedirTexto = (titulo, rotulo, dica = "") => dialogo({titulo,
  corpo: `<div class="campo"><label>${esc(rotulo)}</label><input type="text" id="dlg-txt" placeholder="${esc(dica)}"></div>`,
  botoes: [["Cancelar", null], ["Criar", f => $("#dlg-txt", f).value.trim() || null, "pri"]]});

/* ------------------------------------------------------------------ Markdown (mínimo) + Mermaid */
let contMmd = 0;
function md(texto) {
  const linhas = texto.replace(/<!--[\s\S]*?-->/g, "").replace(/^---\n[\s\S]*?\n---\n/, "").split("\n"); let html = "", i = 0;
  const inl = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>")
    .replace(/\[PREENCHER[^\]]*\]/g, m => `<span class="lac">${m}</span>`)
    .replace(/\b((?:RF|RNF|RN|UC|HU|TL|CT|ADR|CM|EP|ENT)-\d{2,4})\b/g, '<span class="id">$1</span>')
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let nTit = 0;
  while (i < linhas.length) {
    const l = linhas[i]; let m;
    if ((m = l.match(/^```\s*(\w*)/))) {
      const b = []; i++; while (i < linhas.length && !/^```/.test(linhas[i])) b.push(linhas[i++]); i++;
      if (m[1] === "mermaid") html += `<div class="mmd" data-mmd="${++contMmd}"><pre><code>${esc(b.join("\n"))}</code></pre></div>`;
      else html += `<pre><code>${esc(b.join("\n"))}</code></pre>`;
      continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { const n = m[1].length; html += `<h${n} id="t-${nTit++}">${inl(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const rows = []; while (i < linhas.length && /^\s*\|/.test(linhas[i])) rows.push(linhas[i++]);
      const cel = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const temCab = rows.length > 1 && /^\s*\|[\s:|-]+\|\s*$/.test(rows[1]);
      const corpo = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      html += "<table>" + corpo.map((r, k) => "<tr>" + cel(r).map(c => k === 0 && temCab ? `<th>${inl(c)}</th>` : `<td>${inl(c)}</td>`).join("") + "</tr>").join("") + "</table>"; continue;
    }
    if (/^\s*[-*]\s+/.test(l)) { html += "<ul>"; while (i < linhas.length && /^\s*[-*]\s+/.test(linhas[i])) html += `<li>${inl(linhas[i++].replace(/^\s*[-*]\s+(\[[ xX]\]\s*)?/, (a, c) => c ? (/x/i.test(c) ? "☑ " : "☐ ") : ""))}</li>`; html += "</ul>"; continue; }
    if (/^\s*\d+\.\s+/.test(l)) { html += "<ol>"; while (i < linhas.length && /^\s*\d+\.\s+/.test(linhas[i])) html += `<li>${inl(linhas[i++].replace(/^\s*\d+\.\s+/, ""))}</li>`; html += "</ol>"; continue; }
    if (/^>\s?/.test(l)) { const b = []; while (i < linhas.length && /^>\s?/.test(linhas[i])) b.push(inl(linhas[i++].replace(/^>\s?/, ""))); html += `<blockquote>${b.join("<br>")}</blockquote>`; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { html += "<hr>"; i++; continue; }
    if (l.trim()) html += `<p>${inl(l)}</p>`;
    i++;
  }
  return html;
}

let mermaidPronto = null;
function temaEscuro() { const t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function carregarMermaid() {
  if (!mermaidPronto) mermaidPronto = new Promise((ok, erro) => {
    const s = document.createElement("script"); s.src = "/estatico/mermaid.min.js?t=" + encodeURIComponent(TOKEN);
    s.onload = () => ok(window.mermaid); s.onerror = () => { mermaidPronto = null; erro(new Error("mermaid.js não carregou")); };
    document.head.append(s);
  });
  return mermaidPronto;
}
async function desenharDiagramas(raiz) {
  const blocos = $$(".mmd[data-mmd]", raiz); if (!blocos.length) return;
  let m; try { m = await carregarMermaid(); } catch { return; }
  m.initialize({startOnLoad: false, securityLevel: "strict", theme: temaEscuro() ? "dark" : "neutral", fontFamily: "Segoe UI, system-ui, sans-serif"});
  for (const b of blocos) {
    const codigo = b.textContent;
    try { const {svg} = await m.render("mmd-" + b.dataset.mmd + "-" + Date.now(), codigo); b.innerHTML = svg; }
    catch (e) { b.innerHTML = `<div class="erro-mmd">Diagrama com erro de sintaxe: ${esc((e.message || String(e)).split("\n")[0])}</div><pre><code>${esc(codigo)}</code></pre>`; }
    b.removeAttribute("data-mmd");
    if (!b.querySelector("details")) b.insertAdjacentHTML("beforeend", `<details><summary>ver código</summary><pre><code>${esc(codigo)}</code></pre></details>`);
  }
}

/* ------------------------------------------------------------------ tema */
const TEMAS = ["sistema", "claro", "escuro"];
function aplicarTema(t) {
  if (t === "claro") document.documentElement.dataset.theme = "light"; else if (t === "escuro") document.documentElement.dataset.theme = "dark";
  else delete document.documentElement.dataset.theme;
  $("#bt-tema span").textContent = "Tema: " + t; guardar("tema", t);
}
function trocarTema() { aplicarTema(TEMAS[(TEMAS.indexOf(lembrar("tema", "sistema")) + 1) % 3]); if (E.projeto && (E.aba === "docs" || E.aba === "kit")) desenharProjeto(); }

/* ------------------------------------------------------------------ barra lateral */
async function carregarProjetos() {
  try { E.projetos = await prumo(["projetos"]) || []; } catch { E.projetos = []; }
  desenharLista();
}
function desenharLista() {
  const f = ($("#filtro-proj").value || "").toLowerCase();
  const lista = E.projetos.filter(p => !f || `${p.nome} ${p.cliente} ${p.caminho}`.toLowerCase().includes(f));
  $("#lista-proj").innerHTML = lista.length ? lista.map(p => `
    <div class="proj ${E.projeto === p.caminho ? "ativo" : ""}" data-c="${esc(p.caminho)}" title="${esc(p.caminho)}" role="button" tabindex="0">
      <span class="av" style="background:${corDe(p.nome)}">${esc(iniciais(p.nome))}</span>
      <span class="tx"><b>${esc(p.nome)}</b><span>${esc(p.cliente && !p.cliente.startsWith("[") ? p.cliente : p.perfil || "")}</span></span>
      <button class="x" data-rem="${esc(p.caminho)}" title="Tirar da lista (não apaga a pasta)" aria-label="Tirar da lista">${ic("x")}</button></div>`).join("")
    : `<div class="legenda" style="padding:4px 10px">${E.projetos.length ? "Nenhum projeto encontrado." : "Nenhum projeto ainda."}</div>`;
  $$(".proj").forEach(b => {
    b.onclick = e => { if (!e.target.closest(".x")) abrirProjeto(b.dataset.c); };
    b.onkeydown = e => { if (e.key === "Enter") abrirProjeto(b.dataset.c); };
  });
  $$(".proj .x").forEach(b => b.onclick = async () => {
    if (!await confirmar("Tirar da lista?", "O projeto some dos recentes. A pasta e os arquivos continuam intactos.", "Tirar da lista")) return;
    try { E.projetos = await prumo(["projetos", "--remover", b.dataset.rem]); if (E.projeto === b.dataset.rem) telaVazia(); desenharLista(); } catch (e) { falhou(e); }
  });
}

/* ------------------------------------------------------------------ telas */

function resumo() {
  const docs = E.status.documentos, total = docs.length || 1;
  const completos = docs.filter(d => d.estado !== "em andamento").length;
  const aprov = docs.filter(d => d.estado.startsWith("aprovado")).length;
  const alterados = docs.filter(d => d.estado.includes("ALTERADO")).length;
  const lac = docs.reduce((a, d) => a + d.lacunas, 0);
  const kit = E.kit, kitOk = kit ? kit.filter(k => k.estado !== "ausente").length / (kit.length || 1) : null;
  const val = E.validacao, valOk = val ? (val.erros.length ? 0 : 1) : null;
  // especificar pesa mais; validação só conta na proporção do que já foi especificado
  const pontos = completos / total * 45 + aprov / total * 20 + (valOk ?? 0) * (completos / total) * 20 + (kitOk ?? 0) * 15;
  return {docs, total, completos, aprov, alterados, lac, kitOk, valOk, pct: Math.round(pontos)};
}

let lacIdx = -1;
function proximaLacuna() {

    const linha = ed.value.slice(0, i).split("\n").length; ed.scrollTop = Math.max(0, (linha - 5) * 20.8); return;

async function acompanhar(id, desde, redesenhar) {
  const c = $("#console"); if (!c) return;
  try {
    const r = await api(`/api/tarefas/${id}?desde=${redesenhar ? 0 : desde}`);
    if (redesenhar) c.innerHTML = "";
    const fimVisivel = c.scrollHeight - c.scrollTop - c.clientHeight < 40;
    for (const l of r.linhas) {
      const s = document.createElement("div");
      s.className = /^\s*→/.test(l) ? "f" : /^\[Prumo\]|^===/.test(l) ? "s" : /erro|error/i.test(l) ? "e" : "";
      s.textContent = l; c.append(s);
    }
    if (r.linhas.length && fimVisivel) c.scrollTop = c.scrollHeight;
    if (r.fim) {
      E.job = null; const b = $("#enviar"); if (b) b.disabled = false; const p = $("#parar"); if (p) p.classList.add("oculto");
      toast(r.codigo === 0 ? "Claude concluiu a tarefa." : "A tarefa terminou com erro.", r.codigo !== 0);
      E.validacao = null; E.kit = null; await atualizarStatus().catch(() => {}); carregarHistorico(); return;
    }
    setTimeout(() => acompanhar(id, r.total), 700);
  } catch (e) { falhou(e); E.job = null; }
}

function campoHtml(pref, [k, rot, tipo, ajuda = "", cl = ""], v) {

  if (tipo === "lista") return `<div class="campo ${cl}"><label for="${id}">${esc(rot)}</label><textarea id="${id}" data-k="${k}" data-tipo="lista" style="min-height:70px" class="mono">${esc((v || []).join("\n"))}</textarea>${ajuda ? `<span class="ajuda">${esc(ajuda)}</span>` : ""}</div>`;
  return `<div class="campo ${cl}"><label for="${id}">${esc(rot)}</label><input type="${tipo}" id="${id}" data-k="${k}" data-tipo="${tipo}" value="${esc(v ?? "")}" ${tipo === "number" ? 'min="0" step="any"' : ""}>${ajuda ? `<span class="ajuda">${esc(ajuda)}</span>` : ""}</div>`;
}
function coletar(raiz, prefixo) {

}

           ["Implementar história", "Claude", () => irPara("claude", {tarefa: "implementar"})], ["Regenerar kit do Claude", "kit", () => { irPara("kit"); setTimeout(atualizarKit, 50); }],
           ["Abrir Claude Code no terminal", "ação", () => abrirNo("claude")], ["Abrir no VS Code", "ação", () => abrirNo("vscode")]);
    (E.status.documentos || []).forEach(d => c.push([nomeDoc(d.documento), "documento", () => irPara("docs", {docSel: d.documento, modoDoc: "ver"})]));
    (E.kit || []).forEach(k => c.push([k.nome, k.tipo, () => irPara("kit", {kitSel: k.arquivo, modoDoc: "ver"})]));
  }
  E.projetos.filter(p => p.caminho !== E.projeto).forEach(p => c.push([p.nome, "projeto", () => abrirProjeto(p.caminho)]));
  return c;
}
function abrirPaleta() {
  if ($(".paleta")) return;
  const todos = comandos(); let sel = 0, vis = todos;
  const f = document.createElement("div"); f.className = "fundo";
  f.innerHTML = `<div class="modal paleta" role="dialog" aria-label="Comandos"><input type="text" placeholder="Buscar comando, documento, skill ou projeto…" aria-label="Buscar comando"><div class="res"></div></div>`;
  const inp = $("input", f), res = $(".res", f);
  const fechar = () => f.remove();
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const desenhar = () => {
    const q = norm(inp.value.trim());
    vis = todos.filter(([n, t]) => !q || q.split(/\s+/).every(p => norm(n + " " + t).includes(p))).slice(0, 40); sel = Math.min(sel, Math.max(0, vis.length - 1));
    res.innerHTML = vis.length ? vis.map(([n, t], i) => `<div class="op ${i === sel ? "sel" : ""}" data-i="${i}">${esc(n)}<small>${esc(t)}</small></div>`).join("") : '<div class="legenda" style="padding:12px">Nada encontrado.</div>';
    $$(".op", res).forEach(o => { o.onclick = () => { fechar(); vis[+o.dataset.i][2](); }; o.onmousemove = () => { if (sel !== +o.dataset.i) { sel = +o.dataset.i; desenhar(); } }; });
    const s = $(".op.sel", res); if (s) s.scrollIntoView({block: "nearest"});
  };
  inp.oninput = () => { sel = 0; desenhar(); };
  inp.onkeydown = e => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, vis.length - 1); desenhar(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); desenhar(); }
    else if (e.key === "Enter" && vis[sel]) { fechar(); vis[sel][2](); }
    else if (e.key === "Escape") fechar();
  };
  f.addEventListener("mousedown", e => { if (e.target === f) fechar(); });
  document.body.append(f); desenhar(); inp.focus();
}

    if (inicial) abrirProjeto(inicial); else telaVazia();
  } catch (e) {
    document.body.innerHTML = `<div class="vazio" style="grid-column:1/-1"><div><h2>Sessão expirada</h2><p>Abra a interface de novo com <span class="mono">prumo gui</span> ou pelo prumo-app.exe.</p></div></div>`;
  }
})();
</script>
</body>
</html>
