name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para a auditoria de privacidade
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Privacidade (repositório público, com o histórico)
        if: runner.os == 'Linux'
        run: python .githooks/privacidade.py tudo --historico

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Módulo no PowerShell 7
        shell: pwsh
        run: ./tests/powershell.ps1
      - name: Módulo no Windows PowerShell 5.1
        shell: powershell
        run: ./tests/powershell.ps1

  executavel:
    needs: [testes, powershell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar executáveis
        shell: pwsh
        run: ./build.ps1 -SoDist
      - name: Testar o executável
        shell: pwsh
        run: |
          git config --global user.name "CI"; git config --global user.email "ci@example.com"
          ./dist/prumo.exe --versao
          ./dist/prumo.exe novo "$env:RUNNER_TEMP\demo" --perfil api-rest --nome "Teste" --cliente "Cliente"
          if ($LASTEXITCODE -ne 0) { throw 'novo falhou' }
          ./dist/prumo.exe --projeto "$env:RUNNER_TEMP\demo" validar
          ./dist/prumo.exe --projeto "$env:RUNNER_TEMP\demo" rastreabilidade
          if ($LASTEXITCODE -ne 0) { throw 'rastreabilidade falhou' }
          $env:CLAUDE_PROJECT_DIR = "$env:RUNNER_TEMP\demo"
          '{"tool_input":{"command":"rm -rf /"}}' | ./dist/prumo.exe hook guarda_comandos
          if ($LASTEXITCODE -ne 2) { throw "hook deveria bloquear (saiu $LASTEXITCODE)" }
          '{"tool_input":{"command":"ls"}}' | ./dist/prumo.exe hook guarda_comandos
          if ($LASTEXITCODE -ne 0) { throw 'hook deveria liberar' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: prumo-windows
          path: |
            dist/prumo.exe
            dist/prumo-app.exe
      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0, '.'); from prumo_cli.util import VERSAO; print(VERSAO)"
          "versao=$v" >> $env:GITHUB_OUTPUT
      # Cada push na main publica (ou atualiza) a Release da versão definida em prumo_cli/util.py.
      - name: Publicar release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: Prumo ${{ steps.versao.outputs.versao }}
          make_latest: true
          files: |
            dist/prumo.exe
            dist/prumo-app.exe
